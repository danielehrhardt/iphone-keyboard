name: Umlaut
options:
  bundleIdPrefix: de.codext
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: URV3W3LX94
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  KeyboardCore:
    path: KeyboardCore
targets:
  Umlaut:
    type: application
    platform: iOS
    sources:
      - path: Umlaut
        excludes: ["Info.plist"]
      # The keyboard UI is compiled into the app as well for the in-app demo keyboard.
      - path: UmlautKeyboard
        excludes: ["Info.plist", "KeyboardViewController.swift", "UmlautKeyboard.entitlements"]
    dependencies:
      - package: KeyboardCore
      - target: UmlautKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.umlaut
        INFOPLIST_FILE: Umlaut/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Umlaut/Umlaut.entitlements
        SUPPORTS_MACCATALYST: NO
  UmlautKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: UmlautKeyboard
        excludes: ["Info.plist", "InApp/**"]
    dependencies:
      - package: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.umlaut.keyboard
        INFOPLIST_FILE: UmlautKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: UmlautKeyboard/UmlautKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  UmlautKeyboardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UmlautKeyboardTests]
    dependencies:
      - target: Umlaut
      - package: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.umlaut.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Umlaut.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Umlaut
        BUNDLE_LOADER: $(TEST_HOST)
  UmlautUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UmlautUITests]
    dependencies:
      - target: Umlaut
      - package: KeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.codext.umlaut.uitests
        TEST_TARGET_NAME: Umlaut
schemes:
  Umlaut:
    build:
      targets:
        Umlaut: all
        UmlautKeyboard: all
        UmlautKeyboardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UmlautKeyboardTests
        - UmlautUITests
        - package: KeyboardCore/KeyboardCoreTests
  UmlautKeyboard:
    build:
      targets:
        UmlautKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true
      launchAutomaticallySubstyle: 2
